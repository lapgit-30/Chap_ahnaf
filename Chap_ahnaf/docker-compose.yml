services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ahnaf
      POSTGRES_USER: ahnaf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahnaf -d ahnaf"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ahnaf:${POSTGRES_PASSWORD}@postgres:5432/ahnaf
      APP_URL: ${APP_URL:?APP_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CAPTCHA_SECRET: ${CAPTCHA_SECRET:?CAPTCHA_SECRET is required}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:?SUPER_ADMIN_USERNAME is required}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD is required}
      SUPER_ADMIN_MOBILE: ${SUPER_ADMIN_MOBILE:?SUPER_ADMIN_MOBILE is required}
      SUPER_ADMIN_FULL_NAME: ${SUPER_ADMIN_FULL_NAME:-مدیر کل}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:?KAVENEGAR_API_KEY is required}
      KAVENEGAR_OTP_TEMPLATE: ${KAVENEGAR_OTP_TEMPLATE:-verify}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:?ZARINPAL_MERCHANT_ID is required}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-false}
      UPLOAD_DIR: /app/storage/uploads
    volumes:
      - uploads:/app/storage/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  uploads:
